# Type-check, lint and unit tests on every push and pull request.
# No secrets and no live provider calls: the adapter tests run on recorded
# sample JSON, so CI can never spend API-Football quota.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx next lint
      - run: npx vitest run
